<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Πρωταθλήματα 2026-2027</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-alt: #172033;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #eab308;
    --border: #334155;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 10px;
    font-size: 14px;
  }
  h1 { font-size: 1.2rem; margin: 4px 0 2px; text-align: center; }
  .subtitle { text-align: center; color: var(--muted); font-size: 0.75rem; margin-bottom: 10px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 8px; }
  .tab {
    flex: 1; text-align: center; padding: 9px 4px; background: var(--card);
    border-radius: 10px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
    border: 2px solid transparent; color: var(--muted);
  }
  .tab.active { border-color: var(--accent); color: var(--accent); background: var(--card-alt); }
  .subtabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .subtab {
    flex: 1; text-align: center; padding: 7px 4px; background: var(--card-alt);
    border-radius: 8px; font-size: 0.72rem; font-weight: 600; cursor: pointer;
    border: 1px solid var(--border); color: var(--muted);
  }
  .subtab.active { border-color: var(--green); color: var(--green); }
  .hidden { display: none; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 10px; overflow: hidden; font-size: 0.7rem; }
  th, td { padding: 5px 3px; text-align: center; border-bottom: 1px solid var(--border); }
  th { background: var(--card-alt); color: var(--muted); font-weight: 600; font-size: 0.62rem; text-transform: uppercase; }
  td.team { text-align: left; font-weight: 600; white-space: nowrap; font-size: 0.68rem; }
  td.pts { font-weight: 700; color: var(--accent); }
  .rank-badge { display: inline-block; width: 15px; text-align: center; font-weight: 700; margin-right: 3px; }
  tr.zone-title .rank-badge { color: var(--green); }
  tr.zone-europe .rank-badge { color: var(--yellow); }
  tr.zone-relegation .rank-badge { color: var(--red); }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; margin: 8px 0; font-size: 0.65rem; color: var(--muted); }
  .legend span { display: flex; align-items: center; gap: 4px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .split-wrap { display: flex; gap: 8px; margin-top: 10px; }
  .split-wrap > div { flex: 1; }
  .split-title { font-size: 0.72rem; font-weight: 700; margin-bottom: 4px; color: var(--muted); }
  .note { margin-top: 10px; padding: 8px 10px; background: var(--card-alt); border-radius: 10px; font-size: 0.68rem; color: var(--muted); line-height: 1.4; }
  .mw-header {
    background: var(--card); border-radius: 10px; padding: 10px 12px; margin-bottom: 6px;
    display: flex; justify-content: space-between; align-items: center; cursor: pointer;
    border: 1px solid var(--border); gap: 6px; flex-wrap: wrap;
  }
  .mw-status-wrap { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .acc-badge { font-size: 0.62rem; font-weight: 700; white-space: nowrap; }
  .acc-yellow { color: var(--yellow); }
  .acc-green { color: var(--green); }
  .mw-header.done { border-color: rgba(34,197,94,0.4); }
  .mw-header .mw-title { font-weight: 700; font-size: 0.8rem; }
  .mw-header .mw-date { font-weight: 400; color: var(--muted); font-size: 0.65rem; }
  .match-date { text-align: center; font-size: 0.6rem; color: var(--accent); padding-top: 6px; }
  .mw-header .mw-status { font-size: 0.65rem; color: var(--muted); }
  .mw-body { background: var(--card-alt); border-radius: 10px; padding: 8px; margin: -4px 0 10px; }
  .match-row {
    display: flex; align-items: center; gap: 6px; padding: 7px 4px;
    border-bottom: 1px solid var(--border); font-size: 0.72rem;
  }
  .match-row:last-child { border-bottom: none; }
  .match-row .home { flex: 1; text-align: right; }
  .match-row .away { flex: 1; text-align: left; }
  .score-inputs { display: flex; align-items: center; gap: 3px; }
  .score-inputs input {
    width: 32px; text-align: center; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 2px; font-size: 0.8rem;
  }
  .score-inputs input:focus { border-color: var(--accent); outline: none; }
  .dash { color: var(--muted); }
  .match-row-wrap { border-bottom: 1px solid var(--border); }
  .match-row-wrap:last-child { border-bottom: none; }
  .match-row-wrap .match-row { border-bottom: none; }
  .predict-hint { text-align: center; font-size: 0.62rem; color: var(--yellow); padding-bottom: 5px; }
  .predict-hint.hit-exact { color: var(--green); }
  .predict-hint.hit-result { color: var(--yellow); }
  .predict-hint.hit-miss { color: var(--red); }
  .probs-line { text-align: center; font-size: 0.58rem; color: var(--muted); padding-bottom: 6px; }
  .h2h-tag { color: var(--accent); }
  .api-box { background: var(--card); border-radius: 10px; padding: 10px; margin-bottom: 10px; border: 1px solid var(--border); }
  .api-row { display: flex; gap: 6px; margin-bottom: 6px; }
  .api-row:last-child { margin-bottom: 0; }
  .api-row input, .api-row select {
    flex: 1; background: var(--card-alt); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px; font-size: 0.75rem; min-width: 0;
  }
  .api-row button {
    background: var(--accent); color: var(--bg); border: none; border-radius: 8px;
    padding: 8px 10px; font-size: 0.72rem; font-weight: 700; white-space: nowrap; cursor: pointer;
  }
  .api-status { font-size: 0.68rem; color: var(--muted); margin-top: 4px; }
  .reset-btn {
    display: block; width: 100%; margin-top: 14px; padding: 10px; background: var(--card);
    border: 1px solid var(--border); border-radius: 10px; color: var(--red);
    font-size: 0.75rem; font-weight: 600; cursor: pointer;
  }
</style>
</head>

function getWorkerUrl() { return (localStorage.getItem("protathlimata_worker_url") || "").trim().replace(/\/$/, ""); }

// Το football-data.org (δωρεάν πλάνο) δεν επιτρέπει απευθείας κλήσεις από browser (CORS).
// Αντί για public proxy τρίτων, καλούμε το δικό σου Cloudflare Worker (βλ. cloudflare-worker.js),
// που κρατάει το API key του football-data.org μυστικό και προσθέτει τα σωστά CORS headers.
async function apiFetch(path) {
  const base = getWorkerUrl();
  if (!base) throw new Error("NOKEY");
  const res = await fetch(base + path);
  if (res.status === 429) throw new Error("RATE_LIMIT");
  if (res.status === 403) throw new Error("FORBIDDEN");
  if (!res.ok) throw new Error("HTTP_" + res.status);
  return res.json();
}

    renderApiView(code);
  } catch (e) {
    if (e.message === "NOKEY") statusEl.textContent = "⚠️ Βάλε πρώτα το URL του Worker σου και πάτα Αποθήκευση.";
    else if (e.message === "RATE_LIMIT") statusEl.textContent = "⚠️ Έφτασες το όριο αιτημάτων (10/λεπτό). Δοκίμασε ξανά σε λίγο.";
    else if (e.message === "FORBIDDEN") statusEl.textContent = "⚠️ Μη έγκυρο API key στο Worker σου, ή αυτό το πρωτάθλημα δεν καλύπτεται στο δωρεάν πλάνο σου.";
    else statusEl.textContent = "⚠️ Σφάλμα σύνδεσης (" + e.message + "). Δοκίμασε ξανά σε λίγο.";
  }
}

function renderSimpleSplit(table) {

function renderApiView(code) {
  const cache = apiCache[code];
  if (!cache) return;
  const total = cache.standings.standings.find(s=>s.type==="TOTAL");
  const home = cache.standings.standings.find(s=>s.type==="HOME");
  const away = cache.standings.standings.find(s=>s.type==="AWAY");

  let html = `<table><thead><tr><th>#</th><th class="team">Ομάδα</th><th>Αγ</th><th>Ν</th><th>Ι</th><th>Η</th><th>ΓΥ</th><th>ΓΚ</th><th>Δ</th><th>Β</th></tr></thead><tbody>`;
  (total ? total.table : []).forEach(row => {
    html += `<tr><td>${row.position}</td><td class="team">${row.team.name}</td><td>${row.playedGames}</td><td>${row.won}</td><td>${row.draw}</td><td>${row.lost}</td><td>${row.goalsFor}</td><td>${row.goalsAgainst}</td><td>${row.goalDifference>0?'+':''}${row.goalDifference}</td><td class="pts">${row.points}</td></tr>`;
  });
  html += `</tbody></table>`;
  if (home && away) {
    html += `<div class="split-wrap">
      <div><div class="split-title">🏠 Εντός</div>${renderSimpleSplit(home.table)}</div>
      <div><div class="split-title">✈️ Εκτός</div>${renderSimpleSplit(away.table)}</div>
    </div>`;
  }
  document.getElementById("apiStandings").innerHTML = html;

  // build simple form-weighted attack/defense from finished matches (no prior-season data available generically)
  const matches = cache.matches;
  const finished = matches.filter(m => m.status==="FINISHED" && m.score && m.score.fullTime.home!==null)
    .sort((a,b) => new Date(a.utcDate)-new Date(b.utcDate));
  const logs = {};
  finished.forEach(m => {
    const h=m.homeTeam.name, a=m.awayTeam.name, hg=m.score.fullTime.home, ag=m.score.fullTime.away;
    if (!logs[h]) logs[h]=[]; if (!logs[a]) logs[a]=[];
    logs[h].push({gf:hg,ga:ag}); logs[a].push({gf:ag,ga:hg});
  });
  const leagueAvg = finished.length
    ? finished.reduce((s,m)=>s+m.score.fullTime.home+m.score.fullTime.away,0)/(finished.length*2)
    : 1.3;

  function strength(team) {
    const log = logs[team] || [];
    const RECENT_N=5, RECENT_W=2, K=4;
    let wSum=K, gfSum=leagueAvg*K, gaSum=leagueAvg*K;
    log.forEach((g,idx) => {
      const w = idx >= log.length-RECENT_N ? RECENT_W : 1;
      wSum+=w; gfSum+=g.gf*w; gaSum+=g.ga*w;
    });
    return { attack: gfSum/wSum, defense: gaSum/wSum };
  }
  function predict(h,a) {
    const H=strength(h), A=strength(a);
    const HOME_ADV=1.12;
    const eh=(H.attack*A.defense/leagueAvg)*HOME_ADV;
    const ea=(A.attack*H.defense/leagueAvg)/HOME_ADV;
    return [Math.max(0,Math.round(eh)), Math.max(0,Math.round(ea))];
  }

  const byDay = {};
  matches.forEach(m => { const d=m.matchday||0; (byDay[d]=byDay[d]||[]).push(m); });
  let fx = "";
  Object.keys(byDay).sort((a,b)=>a-b).forEach(day => {
    fx += `<div class="mw-header" data-day="${day}"><span class="mw-title">Αγωνιστική ${day}</span></div><div class="mw-body hidden" id="apimw-${day}">`;
    byDay[day].forEach(m => {
      const dateStr = new Date(m.utcDate).toLocaleDateString('el-GR',{day:'2-digit',month:'2-digit'});
      const h=m.homeTeam.name, a=m.awayTeam.name;
      fx += `<div class="match-row-wrap"><div class="match-date">${dateStr}</div>`;
      if (m.status==="FINISHED" && m.score && m.score.fullTime.home!==null) {
        fx += `<div class="match-row"><span class="home">${h}</span><span>${m.score.fullTime.home} - ${m.score.fullTime.away}</span><span class="away">${a}</span></div>`;
      } else {
        const [ph,pa] = predict(h,a);
        fx += `<div class="match-row"><span class="home">${h}</span><span class="dash">vs</span><span class="away">${a}</span></div><div class="predict-hint">🔮 πιθανό: ${ph}-${pa}</div>`;
      }
      fx += `</div>`;
    });
    fx += `</div>`;
  });
  document.getElementById("apiFixtures").innerHTML = fx;
  document.querySelectorAll("#apiFixtures .mw-header").forEach(hdr => {
    hdr.addEventListener("click", () => {
      document.getElementById("apimw-"+hdr.dataset.day).classList.toggle("hidden");
    });
  });
}

        if (overrides[k]) return [m[0],m[1],m[2],overrides[k][0],overrides[k][1]];

}

// ---------- STANDINGS CALC ----------
function computeStandings(fixtures, names) {
  const table = {};
  Object.keys(names).forEach(t => {
    table[t] = { team:t, p:0,w:0,d:0,l:0,gf:0,ga:0,
      hp:0,hw:0,hd:0,hl:0,hgf:0,hga:0,
      ap:0,aw:0,ad:0,al:0,agf:0,aga:0 };
  });
  fixtures.forEach(([r,h,a,hg,ag]) => {
    if (hg === null || ag === null) return;
    const H = table[h], A = table[a];
    H.p++; A.p++; H.hp++; A.ap++;
    H.gf += hg; H.ga += ag; H.hgf += hg; H.hga += ag;
    A.gf += ag; A.ga += hg; A.agf += ag; A.aga += hg;
    if (hg > ag) { H.w++; H.hw++; A.l++; A.al++; }
    else if (hg < ag) { A.w++; A.aw++; H.l++; H.hl++; }
    else { H.d++; H.hd++; A.d++; A.ad++; }
  });
  return Object.values(table).map(t => ({
    ...t, pts: t.w*3 + t.d, gd: t.gf - t.ga,
    hpts: t.hw*3 + t.hd, hgd: t.hgf - t.hga,
    apts: t.aw*3 + t.ad, agd: t.agf - t.aga
  })).sort((x,y) => y.pts - x.pts || y.gd - x.gd || y.gf - x.gf);
}

// ---------- PREDICTION (blends last season's strength with this season's data) ----------
// Prior-season (2025-26) goals for/against per team, used as a starting "strength" estimate.
const PRIOR_EPL = {
  "Arsenal":[71,27], "Man City":[77,35], "Man Utd":[69,50], "Aston Villa":[56,49],
  "Liverpool":[63,53], "Bournemouth":[58,54], "Sunderland":[42,48], "Brighton":[52,46],
  "Brentford":[55,52], "Chelsea":[58,52], "Fulham":[47,51], "Newcastle":[53,55],
  "Everton":[47,50], "Leeds":[49,56], "Crystal Palace":[41,51], "Nott'm Forest":[48,51],
  "Spurs":[48,57]
};
const PRIOR_LIGA = {
  "Barcelona":[95,36], "RealMadrid":[77,35], "Villarreal":[72,46], "Atletico":[62,44],
  "Betis":[59,48], "Celta":[53,48], "Getafe":[32,38], "Rayo":[41,44], "Valencia":[46,55],
  "Sociedad":[59,61], "Espanyol":[43,55], "Athletic":[43,58], "Sevilla":[46,60],
  "Alaves":[44,56], "Elche":[49,57], "Levante":[47,61], "Osasuna":[44,50]
};
const PRIOR_BL = {
  "Bayern":[122,36], "Dortmund":[70,34], "Leipzig":[66,47], "Stuttgart":[71,49],
  "Hoffenheim":[65,52], "Leverkusen":[68,47], "Freiburg":[51,57], "Frankfurt":[61,65],
  "Augsburg":[45,61], "Mainz":[44,53], "UnionBerlin":[44,58], "Gladbach":[42,53],
  "Hamburg":[40,54], "Koln":[49,63], "Bremen":[37,60]
};
// teams with no top-flight data last season (promoted) get a below-average default
function getPriorInfo(league) {
  if (league === "epl") return { data: PRIOR_EPL, games: 38, avg: 1.375, promoted: [37,69] };
  if (league === "liga") return { data: PRIOR_LIGA, games: 38, avg: 1.347, promoted: [37,57] };
  return { data: PRIOR_BL, games: 34, avg: 1.618, promoted: [38,67] };
}

function getTeamLogs(fixtures) {
  const logs = {};
  fixtures.forEach(([r,h,a,hg,ag]) => {
    if (hg === null || ag === null) return;
    if (!logs[h]) logs[h] = [];
    if (!logs[a]) logs[a] = [];
    logs[h].push({r, gf:hg, ga:ag});
    logs[a].push({r, gf:ag, ga:hg});
  });
  Object.values(logs).forEach(arr => arr.sort((x,y)=>x.r-y.r));
  return logs;
}

// K = how many "virtual" prior-season games the prior strength is worth;
// fades out as more real games are played this season.
// Recent games (last RECENT_N) count double, so current form matters more than season-long average.
function blendedStrength(league, team, logs, K) {
  const prior = getPriorInfo(league);
  const priorArr = prior.data[team] || prior.promoted;
  const priorGF = priorArr[0] / prior.games;
  const priorGA = priorArr[1] / prior.games;
  const log = logs[team] || [];
  const RECENT_N = 5, RECENT_WEIGHT = 2;
  let wSum = K, gfSum = priorGF*K, gaSum = priorGA*K;
  log.forEach((g, idx) => {
    const isRecent = idx >= log.length - RECENT_N;
    const w = isRecent ? RECENT_WEIGHT : 1;
    wSum += w; gfSum += g.gf*w; gaSum += g.ga*w;
  });
  return { attack: gfSum/wSum, defense: gaSum/wSum, weight: wSum };
}

// ---------- HEAD-TO-HEAD HISTORY (persists across seasons, independent of the fixture lists) ----------
function h2hKey(t1, t2) { return [t1, t2].sort().join("|"); }

function saveH2H(league, home, away, hg, ag) {
  const storageKey = "protathlimata_h2h_v1";
  let store = {};
  const saved = localStorage.getItem(storageKey);
  if (saved) { try { store = JSON.parse(saved); } catch(e) {} }
  const pk = h2hKey(home, away);
  if (!store[pk]) store[pk] = [];
  store[pk] = store[pk].filter(m => !(m.league===league && m.home===home && m.away===away));
  if (hg !== null && ag !== null) store[pk].push({league, home, away, hg, ag});
  localStorage.setItem(storageKey, JSON.stringify(store));
}

function getH2HRecords(home, away) {
  const storageKey = "protathlimata_h2h_v1";
  let store = {};
  const saved = localStorage.getItem(storageKey);
  if (saved) { try { store = JSON.parse(saved); } catch(e) {} }
  return store[h2hKey(home, away)] || [];
}

// Blends this season's (form-weighted) strength with head-to-head history against this specific opponent.
function getMatchupStrengths(fixtures, home, away, excludeRound, league) {
  const pool = (excludeRound !== undefined)
    ? fixtures.filter(f => !(f[0]===excludeRound && f[1]===home && f[2]===away))
    : fixtures;
  const logs = getTeamLogs(pool);
  const K = 6;
  const H = blendedStrength(league, home, logs, K);
  const A = blendedStrength(league, away, logs, K);

  const h2h = getH2HRecords(home, away).filter(r => !(r.league===league && r.home===home && r.away===away));
  if (h2h.length > 0) {
    let sumHomeGF = 0, sumAwayGF = 0;
    h2h.forEach(r => {
      if (r.home === home) { sumHomeGF += r.hg; sumAwayGF += r.ag; }
      else { sumHomeGF += r.ag; sumAwayGF += r.hg; }
    });
    const h2hAvgHome = sumHomeGF / h2h.length;
    const h2hAvgAway = sumAwayGF / h2h.length;
    const h2hWeight = Math.min(h2h.length, 4) * 1.5;
    H.attack = (H.attack*H.weight + h2hAvgHome*h2hWeight) / (H.weight + h2hWeight);
    A.attack = (A.attack*A.weight + h2hAvgAway*h2hWeight) / (A.weight + h2hWeight);
  }
  return { H, A, leagueAvg: getPriorInfo(league).avg, HOME_ADV: 1.12, h2hCount: h2h.length };
}

function predictScore(fixtures, home, away, excludeRound, league) {
  const { H, A, leagueAvg, HOME_ADV } = getMatchupStrengths(fixtures, home, away, excludeRound, league);
  const expHome = (H.attack * A.defense / leagueAvg) * HOME_ADV;
  const expAway = (A.attack * H.defense / leagueAvg) / HOME_ADV;
  return [Math.max(0, Math.round(expHome)), Math.max(0, Math.round(expAway))];
}

// Poisson probability mass function
function poissonP(k, lambda) {
  return Math.exp(-lambda) * Math.pow(lambda, k) / factorial(k);
}
function factorial(n) { let r=1; for(let i=2;i<=n;i++) r*=i; return r; }

// 1-X-2 win/draw/away probabilities from the same expected-goals model (Poisson, capped at 8 goals each)
function predictProbabilities(fixtures, home, away, excludeRound, league) {
  const { H, A, leagueAvg, HOME_ADV } = getMatchupStrengths(fixtures, home, away, excludeRound, league);
  const lamH = (H.attack * A.defense / leagueAvg) * HOME_ADV;
  const lamA = (A.attack * H.defense / leagueAvg) / HOME_ADV;
  let pHome=0, pDraw=0, pAway=0;
  const MAXG = 8;
  for (let i=0;i<=MAXG;i++) {
    for (let j=0;j<=MAXG;j++) {
      const p = poissonP(i,lamH) * poissonP(j,lamA);
      if (i>j) pHome+=p; else if (i<j) pAway+=p; else pDraw+=p;
    }
  }
  const total = pHome+pDraw+pAway;
  return [Math.round(pHome/total*100), Math.round(pDraw/total*100), Math.round(pAway/total*100)];
}

function zoneClass(rank, total) {
  if (rank <= 4) return "zone-title";
  if (rank <= 5) return "zone-europe";
  if (rank > total - 3) return "zone-relegation";
  return "";
}

// ---------- RENDER FIXTURES VIEW ----------
function renderFixturesView() {
  const league = currentLeague;
  const fixtures = getData(league);
  const names = getNames(league);
  const dates = getDates(league);
  const rounds = {};
  fixtures.forEach((m,i) => { (rounds[m[0]] = rounds[m[0]] || []).push({m, i}); });

  let html = "";
  Object.keys(rounds).sort((a,b)=>a-b).forEach(r => {
    const entries = rounds[r];
    const matches = entries.map(e=>e.m);
    const playedCount = matches.filter(m=>m[3]!==null).length;
    const done = playedCount === matches.length;
    const roundDates = entries.map(e=>dates[e.i]);
    const uniqueDates = [...new Set(roundDates)];
    const dateLabel = uniqueDates.length === 1 ? uniqueDates[0] : (uniqueDates[0] + '–' + uniqueDates[uniqueDates.length-1]);

    // accuracy of predictions among already-played matches in this round
    let resultHits = 0, exactHits = 0;
    entries.forEach(({m, i}) => {
      const [rr,h,a,hg,ag] = m;
      if (hg === null || ag === null) return;
      const [ph,pa] = predictScore(fixtures, h, a, rr, league);
      const actualResult = hg>ag?'H':(hg<ag?'A':'D');
      const predResult = ph>pa?'H':(ph<pa?'A':'D');
      if (actualResult === predResult) resultHits++;
      if (ph===hg && pa===ag) exactHits++;
    });
    let accuracyBadges = "";
    if (playedCount > 0) {
      const resultPct = Math.round(resultHits/playedCount*100);
      const exactPct = Math.round(exactHits/playedCount*100);
      accuracyBadges = `<span class="acc-badge acc-yellow" title="Σωστός νικητής/ισοπαλία">🟡 ${resultPct}%</span><span class="acc-badge acc-green" title="Ακριβές σκορ">🟢 ${exactPct}%</span>`;
    }

    html += `<div class="mw-header ${done?'done':''}" data-round="${r}">
      <span class="mw-title">Αγωνιστική ${r} <span class="mw-date">(${dateLabel})</span></span>
      <span class="mw-status-wrap">${accuracyBadges}<span class="mw-status">${playedCount}/${matches.length} ${done?'✓':''}</span></span>
    </div>
    <div class="mw-body hidden" id="mwbody-${r}">`;
    entries.forEach(({m, i}) => {
      const [rr,h,a,hg,ag] = m;
      const matchDate = dates[i];
      const [ph,pa] = predictScore(fixtures, h, a, rr, league);
      const [p1,pX,p2] = predictProbabilities(fixtures, h, a, rr, league);
      const h2hCount = getH2HRecords(h, a).filter(rec => !(rec.league===league && rec.home===h && rec.away===a)).length;
      const h2hNote = h2hCount > 0 ? ` <span class="h2h-tag">βάσει ${h2hCount} προηγ.</span>` : "";
      const probsLine = `<div class="probs-line">${p1}% · ${pX}% Χ · ${p2}%${h2hNote}</div>`;
      let predictHint = "";
      if (hg === null || ag === null) {
        predictHint = `<div class="predict-hint">🔮 πιθανό: ${ph}-${pa}</div>${probsLine}`;
      } else {
        const exactHit = (ph===hg && pa===ag);
        const actualResult = hg>ag?'H':(hg<ag?'A':'D');
        const predResult = ph>pa?'H':(ph<pa?'A':'D');
        const resultHit = actualResult === predResult;
        const cls = exactHit ? 'hit-exact' : (resultHit ? 'hit-result' : 'hit-miss');
        const label = exactHit ? '✅ ακριβές' : (resultHit ? '🟡 σωστό αποτέλεσμα' : '❌');
        predictHint = `<div class="predict-hint ${cls}">🔮 πρόβλεψη ήταν: ${ph}-${pa} · ${label}</div>`;
      }
      html += `<div class="match-row-wrap">
      <div class="match-date">${matchDate}</div>
      <div class="match-row">
        <span class="home">${names[h]}</span>
        <span class="score-inputs">
          <input type="number" min="0" max="20" data-round="${rr}" data-home="${h}" data-away="${a}" data-side="h" value="${hg===null?'':hg}">
          <span class="dash">-</span>
          <input type="number" min="0" max="20" data-round="${rr}" data-home="${h}" data-away="${a}" data-side="a" value="${ag===null?'':ag}">
        </span>
        <span class="away">${names[a]}</span>
      </div>${predictHint}</div>`;
    });
    html += `</div>`;
  });
  document.getElementById("view-fixtures").innerHTML = html;

  // accordion toggles
  document.querySelectorAll(".mw-header").forEach(hdr => {
    hdr.addEventListener("click", () => {
      const r = hdr.dataset.round;
      document.getElementById("mwbody-"+r).classList.toggle("hidden");
    });
  });

  // score inputs
  document.querySelectorAll(".score-inputs input").forEach(inp => {
    inp.addEventListener("change", () => {
      const round = parseInt(inp.dataset.round);
      const home = inp.dataset.home;
      const away = inp.dataset.away;
      const data = getData(currentLeague);
      const match = data.find(m => m[0]===round && m[1]===home && m[2]===away);
      const homeInput = document.querySelector(`input[data-round="${round}"][data-home="${home}"][data-away="${away}"][data-side="h"]`);
      const awayInput = document.querySelector(`input[data-round="${round}"][data-home="${home}"][data-away="${away}"][data-side="a"]`);
      const hv = homeInput.value === "" ? null : parseInt(homeInput.value);
      const av = awayInput.value === "" ? null : parseInt(awayInput.value);
      match[3] = (hv===null || isNaN(hv)) ? null : hv;
      match[4] = (av===null || isNaN(av)) ? null : av;
      saveScore(currentLeague, round, home, away, match[3], match[4]);
      saveH2H(currentLeague, home, away, match[3], match[4]);
      renderFixturesView();
      renderTableView();
    });
  });
}

function render() {
  const isApi = currentLeague === "api";
  document.querySelector(".subtabs").classList.toggle("hidden", isApi);
  document.getElementById("view-table").classList.toggle("hidden", isApi || currentView !== "table");
  document.getElementById("view-fixtures").classList.toggle("hidden", isApi || currentView !== "fixtures");
  document.getElementById("view-api").classList.toggle("hidden", !isApi);
  document.querySelector(".legend").classList.toggle("hidden", isApi);
  document.getElementById("resetBtn").classList.toggle("hidden", isApi);
  if (isApi) return;
  renderTableView();
  renderFixturesView();
}

// ---------- EVENT WIRING ----------
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    tab.classList.add("active");
    currentLeague = tab.dataset.league;
    render();
  });
});
document.querySelectorAll(".subtab").forEach(st => {
  st.addEventListener("click", () => {
    document.querySelectorAll(".subtab").forEach(t=>t.classList.remove("active"));
    st.classList.add("active");
    currentView = st.dataset.view;
    render();
  });
});
document.getElementById("resetBtn").addEventListener("click", () => {
  const leagueLabel = currentLeague==="epl" ? "Premier League" : (currentLeague==="liga" ? "La Liga" : "Bundesliga");
  if (!confirm("Σίγουρα θέλεις να διαγράψεις όλα τα καταχωρημένα σκορ για το τρέχον πρωτάθλημα (" + leagueLabel + ");")) return;
  localStorage.removeItem("protathlimata_" + currentLeague + "_v1");
  if (currentLeague === "epl") eplData = loadFixtures("epl");
  else if (currentLeague === "liga") ligaData = loadFixtures("liga");
  else blData = loadFixtures("bundesliga");
  render();
});

render();
initApiMode();
</script>

</body>
</html>
